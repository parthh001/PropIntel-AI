version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: propintel-db
    environment:
      POSTGRES_DB: propintel
      POSTGRES_USER: propintel
      POSTGRES_PASSWORD: propintel_secret_2026
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propintel"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: propintel-redis
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
  app:
    build: .
    container_name: propintel-app
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://propintel:propintel_secret_2026@postgres:5432/propintel
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: change-in-production-min-32-characters
      JWT_REFRESH_SECRET: change-refresh-secret-min-32-characters
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  postgres_data:
  redis_data:
